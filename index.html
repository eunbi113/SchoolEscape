<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심야의 학교</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="title-screen">

        <!-- 밤하늘 -->
        <div class="sky">
            <div class="moon"></div>
        </div>

        <!-- 학교 실루엣 -->
        <div class="school">
            <div class="building main-building"></div>
            <div class="building left-building"></div>
            <div class="building right-building"></div>
        </div>

        <!-- 제목 -->
        <section class="content">

            <h1>
                심야의 학교
                <span>The Midnight School</span>
            </h1>

            <p class="story">
                내일 전공 시험.<br>
                하지만 가장 중요한 물건을 학교에 두고 왔다.
            </p>

            <div class="buttons">
                <button id="startButton">START</button>
                <button disabled>이어하기</button>
            </div>

            <p id="message"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
