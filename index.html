<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심야의 학교</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         타이틀 화면
    ========================== -->
    <section id="titleScreen" class="screen">

        <h1>심야의 학교</h1>

        <p class="subtitle">
            내일은 중요한 전공 시험.<br>
            하지만 필요한 물건을 학교에 두고 왔다.
        </p>

        <div class="button-group">
            <button id="newGameBtn">새 게임</button>
            <button id="continueBtn">이어하기</button>
        </div>

    </section>


    <!-- =========================
         교문 화면
    ========================== -->
    <section id="gateScreen" class="screen hidden">

        <h2>교문</h2>

        <div class="story-box">
            <p>
                밤 11시.<br><br>

                학교는 이미 불이 꺼져 있다.<br>
                내일 시험에 필요한 <strong>토슈즈</strong>를
                교실 사물함에 두고 온 것이 생각났다.<br><br>

                다시 집으로 돌아갈 수는 없다.
            </p>
        </div>

        <button id="enterSchoolBtn">
            학교 안으로 들어간다
        </button>

    </section>


    <!-- =========================
         정문 입구
    ========================== -->
    <section id="entranceScreen" class="screen hidden">

        <h2>정문 입구</h2>

        <p>
            학교 안으로 들어왔다.<br>
            사방이 조용하다.
        </p>

        <button id="stairsBtn">
            계단으로 이동
        </button>

    </section>


    <!-- =========================
         계단 화면
         새로운 공간은 아래와 같은 방식으로
         section을 하나씩 추가하면 된다.
    ========================== -->
    <section id="stairsScreen" class="screen hidden">

        <h2>계단</h2>

        <div class="story-box">
            <p>
                학교는 매우 조용하다.<br><br>
                어디부터 살펴볼까?
            </p>
        </div>

        <!-- =====================
             층 이동 버튼
             학생들은 버튼을 자유롭게
             추가하거나 삭제할 수 있다.
        ====================== -->
        <div class="button-group vertical">

            <button id="basementBtn">
                지하로 내려간다
            </button>

            <button id="floor1Btn">
                1층으로 간다
            </button>

            <button id="floor2Btn">
                2층으로 간다
            </button>

        </div>

    </section>

</section>

<!-- =========================
     지하 복도 화면
========================= -->
<section id="basementHallScreen" class="screen hidden">

    <h2>지하 복도</h2>

    <div class="story-box">
        <p>
            지하로 내려왔다.<br><br>
            복도는 어둡고 조용하다.
        </p>
    </div>

</section>

<script src="script.js"></script>
